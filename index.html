﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源中心</title>
  <style>
    :root {
      --bg-body: #f5f7fa;
      --bg-surface: #ffffff;
      --bg-hover: #f0f2f5;
      --bg-active: #e8f4ff;
      --border: #e0e6ed;
      --text-main: #1d2939;
      --text-muted: #667085;
      --text-accent: #2970ff;
      --primary: #2970ff;
      --primary-hover: #155fec;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    /* 顶部导航栏 */
    .header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
      color: var(--text-main);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .logo svg { width: 28px; height: 28px; color: var(--primary); }

    .search-container {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 12px 48px 12px 48px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 15px;
      background: var(--bg-body);
      transition: all 0.2s ease;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
      background: var(--bg-surface);
      box-shadow: 0 0 0 4px rgba(41, 112, 255, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-shortcut {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
    }

    /* 快捷入口区域 */
    .quick-access {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .quick-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quick-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .quick-card-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .quick-card.software .quick-card-icon { background: #eef4ff; }
    .quick-card.tools .quick-card-icon { background: #fff4e6; }
    .quick-card.docs .quick-card-icon { background: #f0fdf4; }
    .quick-card.faq .quick-card-icon { background: #fef3c7; }
    .quick-card.ai .quick-card-icon { background: #f3e8ff; }

    .quick-card-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .quick-card-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    .quick-card-count {
      margin-top: auto;
      font-size: 13px;
      color: var(--primary);
      font-weight: 500;
    }

    /* 文件区域 */
    .files-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .files-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 文件卡片网格 */
    .file-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .file-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .file-card:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .file-card-header {
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .file-card-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--bg-body);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .file-card-icon svg { width: 28px; height: 28px; }

    .file-card-info {
      flex: 1;
      min-width: 0;
    }

    .file-card-name {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 6px 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-card-meta {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .file-card-category {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .file-card-category::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .file-card-body {
      padding: 0 20px 20px 20px;
    }

    .ai-explanation {
      background: var(--bg-body);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.6;
    }

    .ai-explanation-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--primary);
    }

    .file-card-footer {
      display: flex;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    /* 搜索结果 */
    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      margin-top: 8px;
      max-height: 400px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }

    .search-results.show {
      display: block;
    }

    .search-result-item {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .search-result-item:hover {
      background: var(--bg-hover);
    }

    .search-result-item + .search-result-item {
      border-top: 1px solid var(--border);
    }

    .search-result-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--bg-body);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .search-result-icon svg { width: 20px; height: 20px; }

    .search-result-info {
      flex: 1;
    }

    .search-result-name {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 2px 0;
    }

    .search-result-category {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    /* 悬浮球助手 */
    .floating-helper {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 500;
    }

    .floating-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
      z-index: 501;
    }

    .floating-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 32px rgba(41, 112, 255, 0.4);
    }

    .floating-btn svg { width: 32px; height: 32px; }

    .floating-panel {
      position: fixed;
      bottom: 108px;
      right: 32px;
      width: 420px;
      height: 600px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(20px) scale(0.95);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .floating-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .panel-header {
      padding: 20px;
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-avatar svg { width: 24px; height: 24px; }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .panel-subtitle {
      font-size: 13px;
      opacity: 0.9;
      margin: 2px 0 0 0;
    }

    .panel-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: var(--bg-body);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .chat-message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .chat-message.bot {
      align-self: flex-start;
    }

    .chat-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 1.6;
    }

    .chat-message.user .chat-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .chat-message.bot .chat-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .chat-file-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-top: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
    }

    .chat-file-card:hover {
      border-color: var(--primary);
      background: var(--bg-active);
    }

    .chat-file-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--bg-body);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .chat-file-icon svg { width: 20px; height: 20px; }

    .chat-file-info {
      flex: 1;
      min-width: 0;
    }

    .chat-file-name {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 4px 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-file-category {
      font-size: 12px;
      color: var(--text-muted);
    }

    .panel-footer {
      padding: 16px 20px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      outline: none;
      background: var(--bg-body);
      transition: all 0.15s ease;
    }

    .chat-input:focus {
      border-color: var(--primary);
      background: var(--bg-surface);
    }

    .chat-send {
      padding: 12px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .chat-send:hover {
      background: var(--primary-hover);
    }

    .chat-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 快速问题 */
    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .quick-q-btn {
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quick-q-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .header-inner {
        padding: 0 16px;
        gap: 12px;
      }

      .logo span { display: none; }

      .container { padding: 20px 16px; }

      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .file-cards-grid {
        grid-template-columns: 1fr;
      }

      .floating-panel {
        width: calc(100vw - 32px);
        right: -16px;
        bottom: 88px;
        height: 60vh;
      }

      .floating-helper {
        bottom: 16px;
        right: 16px;
      }

      .floating-btn {
        width: 56px;
        height: 56px;
      }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-body);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 20px;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 15px;
      color: var(--text-muted);
    }

    .loading-error {
      display: none;
      text-align: center;
      max-width: 360px;
    }

    .loading-error.show { display: flex; flex-direction: column; align-items: center; gap: 16px; }

    .loading-error .spinner-wrap { display: none; }
    .loading-error.show .spinner-wrap { display: none; }

    .loading-error-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fef2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
    }

    .loading-error-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .loading-error-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .retry-btn {
      padding: 10px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .retry-btn:hover { background: var(--primary-hover); }

    .ai-disabled-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">正在加载资源...</div>
      <div class="loading-error" id="loadingError">
        <div class="loading-error-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="loading-error-title">加载失败</div>
        <div class="loading-error-desc" id="loadingErrorDesc">
          无法加载文件列表，请检查网络连接或联系管理员。
        </div>
        <button class="retry-btn" onclick="location.reload()">重新加载</button>
      </div>
    </div>
    <!-- 顶部导航栏 -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>资源中心</span>
        </div>
        <div class="search-container">
          <div class="search-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <input type="text" id="searchInput" class="search-box" placeholder="搜索文件、文档、工具...">
          <span class="search-shortcut">⌘K</span>
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="container">
      <!-- 快捷入口 -->
      <section class="quick-access">
        <div class="section-title">快捷入口</div>
        <div class="cards-grid" id="quickCards">
          <div class="quick-card software" data-category="常用软件">
            <div class="quick-card-icon">🧰</div>
            <h3 class="quick-card-title">常用软件</h3>
            <p class="quick-card-desc">办公、开发、常用工具</p>
            <span class="quick-card-count" id="softwareCount">0 个文件</span>
          </div>
          <div class="quick-card tools" data-category="运维工具">
            <div class="quick-card-icon">🛠</div>
            <h3 class="quick-card-title">运维工具</h3>
            <p class="quick-card-desc">系统、网络、诊断工具</p>
            <span class="quick-card-count" id="toolsCount">0 个文件</span>
          </div>
          <div class="quick-card docs" data-category="使用文档">
            <div class="quick-card-icon">📚</div>
            <h3 class="quick-card-title">使用文档</h3>
            <p class="quick-card-desc">安装说明、操作指南</p>
            <span class="quick-card-count" id="docsCount">0 个文件</span>
          </div>
          <div class="quick-card faq" data-category="常见问题">
            <div class="quick-card-icon">🚨</div>
            <h3 class="quick-card-title">常见问题</h3>
            <p class="quick-card-desc">故障排查、问题解答</p>
            <span class="quick-card-count" id="faqCount">0 个文件</span>
          </div>
          <div class="quick-card ai" id="openAiBtn">
            <div class="quick-card-icon">🤖</div>
            <h3 class="quick-card-title">AI 助手</h3>
            <p class="quick-card-desc">智能问答、文件推荐</p>
            <span class="quick-card-count">随时咨询</span>
          </div>
        </div>
      </section>

      <!-- 文件区域 -->
      <section class="files-section">
        <div class="files-header">
          <div>
            <h2 class="section-title" style="margin-bottom: 0;" id="currentCategoryTitle">全部资源</h2>
          </div>
        </div>
        <div id="fileCardsGrid" class="file-cards-grid"></div>
      </section>
    </main>

    <!-- 悬浮球助手 -->
    <div class="floating-helper">
      <button class="floating-btn" id="floatingBtn" aria-label="打开 AI 助手">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <div class="floating-panel" id="floatingPanel">
        <div class="panel-header">
          <div class="panel-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
          </div>
          <div>
            <h3 class="panel-title">IT 小助手</h3>
            <p class="panel-subtitle">有问题？随时问我</p>
          </div>
        </div>
        <div class="panel-body" id="panelBody">
          <div class="chat-message bot">
            <div class="chat-bubble">你好！我是你的专属 IT 助手 👋</div>
          </div>
          <div class="chat-message bot">
            <div class="chat-bubble">我可以帮你推荐文件、解答问题、或者直接下载你需要的东西。有什么可以帮你的？</div>
          </div>
          <div class="quick-questions">
            <button class="quick-q-btn" data-question="有 Chrome 浏览器吗？">有 Chrome 浏览器吗？</button>
            <button class="quick-q-btn" data-question="C 盘满了怎么办？">C 盘满了怎么办？</button>
            <button class="quick-q-btn" data-question="怎么激活 Windows？">怎么激活 Windows？</button>
            <button class="quick-q-btn" data-question="推荐一些好用的工具">推荐一些好用的工具</button>
          </div>
        </div>
        <div class="panel-footer">
          <input type="text" id="panelInput" class="chat-input" placeholder="输入你的问题...">
          <button id="panelSend" class="chat-send">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 先加载配置文件 -->
  <script src="config.js"></script>
  <script>
    if (typeof CONFIG === 'undefined' || !CONFIG.apiKey || CONFIG.apiKey.indexOf('your-api-key') !== -1) {
      window._aiDisabled = true;
    }
  </script>

  <script>
    var FILES = [];
    var activeCategory = "全部";
    var chatHistory = [];
    var aiExplainations = {};

    var searchInput = document.getElementById("searchInput");
    var searchResults = document.getElementById("searchResults");
    var fileCardsGrid = document.getElementById("fileCardsGrid");
    var currentCategoryTitle = document.getElementById("currentCategoryTitle");

    var _aiDisabled = window._aiDisabled || false;
    var LLM_CONFIG = {
      apiKey: (typeof CONFIG !== 'undefined' && CONFIG.apiKey) ? CONFIG.apiKey : '',
      baseURL: (window.location.port === '18888')
        ? window.location.origin
        : ('http://' + (window.location.hostname || 'localhost') + ':18888'),
      model: (typeof CONFIG !== 'undefined' && CONFIG.model) ? CONFIG.model : 'ark-code-latest'
    };

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const icons = {
        archive: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M10 14h4v4h-4z"></path></svg>`,
        document: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`,
        code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>`,
        exe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
        default: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>`
      };
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return icons.archive;
      if (['doc', 'docx', 'pdf', 'xls', 'xlsx', 'ppt', 'pptx'].includes(ext)) return icons.document;
      if (['txt', 'json', 'xml', 'yaml', 'ini', 'conf'].includes(ext)) return icons.code;
      if (['exe', 'msi', 'bat', 'cmd'].includes(ext)) return icons.exe;
      return icons.default;
    }

    async function getAIExplaination(file) {
      var cacheKey = "ai_explain_v2_" + file.category.replace(/\s/g, '_') + "_" + file.name;
      var cached = localStorage.getItem(cacheKey);
      if (cached) return cached;

      if (_aiDisabled || !LLM_CONFIG.apiKey) {
        return getFallbackExplain(file);
      }

      try {
        var response = await fetch(LLM_CONFIG.baseURL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + LLM_CONFIG.apiKey
          },
          body: JSON.stringify({
            model: LLM_CONFIG.model,
            messages: [
              { role: "system", content: "你是一个文件解说助手。用户给你一个文件名和分类，你用一句话（不超过40字）简洁说明这个文件的用途。不要加任何前缀，直接说用途。" },
              { role: "user", content: "文件: \"" + file.name + "\"，分类: \"" + file.category + "\"，请用一句话说明用途。" }
            ],
            temperature: 0.1,
            max_tokens: 80,
            thinking: { type: "disabled" }
          })
        });

        if (!response.ok) throw new Error("API error");

        var data = await response.json();
        var expl = data.choices[0].message.content.trim();
        localStorage.setItem(cacheKey, expl);
        return expl;
      } catch (e) {
        return getFallbackExplain(file);
      }
    }

    function getFallbackExplain(file) {
      var name = file.name.toLowerCase();
      if (name.indexOf('说明') !== -1 || name.indexOf('readme') !== -1) return '使用说明文档，含安装或操作指引';
      if (name.indexOf('安装') !== -1 || name.indexOf('setup') !== -1) return '软件安装程序，下载后双击运行';
      if (name.indexOf('配置') !== -1 || name.indexOf('config') !== -1) return '配置文件，可自定义参数和选项';
      return '根据文件名判断，这是一款实用工具/文档，下载后按说明使用';
    }

    function getCategoryFiles(category) {
      if (category === "全部") return FILES;
      return FILES.filter(f => f.category === category);
    }

    function updateCounts() {
      document.getElementById("softwareCount").textContent = FILES.filter(f => f.category === "常用软件").length + " 个文件";
      document.getElementById("toolsCount").textContent = FILES.filter(f => f.category === "运维工具").length + " 个文件";
      document.getElementById("docsCount").textContent = FILES.filter(f => f.category === "使用文档").length + " 个文件";
      document.getElementById("faqCount").textContent = FILES.filter(f => f.category === "常见问题").length + " 个文件";
    }

    function renderFileCards() {
      const files = getCategoryFiles(activeCategory);
      
      if (files.length === 0) {
        fileCardsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <div style="font-size: 16px; margin-bottom: 8px;">当前分类下暂无文件</div>
            <div style="font-size: 14px; color: var(--text-muted);">换个分类试试，或者直接使用搜索功能</div>
          </div>
        `;
        return;
      }

      fileCardsGrid.innerHTML = files.map((f, idx) => `
        <div class="file-card">
          <div class="file-card-header">
            <div class="file-card-icon">${getFileIcon(f.name)}</div>
            <div class="file-card-info">
              <h3 class="file-card-name" title="${f.name}">${f.name}</h3>
              <div class="file-card-meta">
                <span class="file-card-category">${f.category}</span>
              </div>
            </div>
          </div>
          <div class="file-card-body">
            <div class="ai-explanation">
              <div class="ai-explanation-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                AI 解说
              </div>
              <div id="ai-explain-${idx}" class="ai-explain-text">正在分析...</div>
            </div>
            <div class="file-card-footer">
              <a href="${f.href}" class="btn btn-primary" download>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                下载
              </a>
              <button class="btn btn-secondary" onclick="askAIAboutFile('${f.name.replace(/'/g, "\\'")}')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                问 AI
              </button>
            </div>
          </div>
        </div>
      `).join("");

      files.forEach((f, idx) => {
        getAIExplaination(f).then(expl => {
          const el = document.getElementById("ai-explain-" + idx);
          if (el) el.textContent = expl;
        });
      });
    }

    function performSearch(query) {
      if (!query.trim()) {
        searchResults.classList.remove("show");
        return;
      }

      const q = query.toLowerCase();
      const results = FILES.filter(f => 
        f.name.toLowerCase().includes(q) || 
        f.category.toLowerCase().includes(q) ||
        f.desc?.toLowerCase().includes(q)
      );

      if (results.length === 0) {
        searchResults.innerHTML = `
          <div class="search-result-item" style="cursor: default;">
            <div class="search-result-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <div class="search-result-info">
              <div class="search-result-name">未找到匹配的文件</div>
              <div class="search-result-category">试试其他关键词，或者问 AI 助手</div>
            </div>
          </div>
        `;
      } else {
        searchResults.innerHTML = results.slice(0, 10).map(f => `
          <div class="search-result-item" onclick="openSearchResult('${f.name}')">
            <div class="search-result-icon">${getFileIcon(f.name)}</div>
            <div class="search-result-info">
              <div class="search-result-name">${f.name}</div>
              <div class="search-result-category">${f.category}</div>
            </div>
          </div>
        `).join("");
      }

      searchResults.classList.add("show");
    }

    function openSearchResult(filename) {
      const file = FILES.find(f => f.name === filename);
      if (file) {
        activeCategory = file.category;
        currentCategoryTitle.textContent = file.category;
        searchInput.value = "";
        searchResults.classList.remove("show");
        renderFileCards();
      }
    }

    function askAIAboutFile(filename) {
      openFloatingPanel();
      sendMessage(`详细介绍一下 "${filename}"，这个文件是做什么的？`);
    }

    function openFloatingPanel() {
      document.getElementById("floatingPanel").classList.add("open");
      setTimeout(() => document.getElementById("panelInput").focus(), 100);
    }

    function appendChatMessage(text, isUser) {
      if (isUser === undefined) isUser = false;
      var panelBody = document.getElementById("panelBody");
      var msgDiv = document.createElement("div");
      msgDiv.className = 'chat-message ' + (isUser ? 'user' : 'bot');
      msgDiv.innerHTML = '<div class="chat-bubble">' + text + '</div>';
      panelBody.appendChild(msgDiv);
      panelBody.scrollTop = panelBody.scrollHeight;
    }

    function appendChatFileCard(file) {
      var panelBody = document.getElementById("panelBody");
      var cardDiv = document.createElement("a");
      cardDiv.className = "chat-file-card";
      cardDiv.href = file.href;
      cardDiv.download = "";
      cardDiv.innerHTML = '<div class="chat-file-icon">' + getFileIcon(file.name) + '</div>' +
        '<div class="chat-file-info">' +
        '<div class="chat-file-name" title="' + file.name + '">' + file.name + '</div>' +
        '<div class="chat-file-category">' + file.category + '</div>' +
        '</div>';
      var wrapDiv = document.createElement("div");
      wrapDiv.className = "chat-message bot";
      wrapDiv.appendChild(cardDiv);
      panelBody.appendChild(wrapDiv);
      panelBody.scrollTop = panelBody.scrollHeight;
    }

    async function sendMessage(text) {
      if (!text.trim()) return;

      var panelInput = document.getElementById("panelInput");
      var panelSend = document.getElementById("panelSend");

      if (_aiDisabled || !LLM_CONFIG.apiKey) {
        appendChatMessage("AI 助手暂未配置，请联系管理员设置 API Key 后使用。", false);
        return;
      }

      appendChatMessage(text, true);
      panelInput.value = "";
      panelSend.disabled = true;

      var loadingDiv = document.createElement("div");
      loadingDiv.className = "chat-message bot";
      loadingDiv.id = "loading-msg";
      loadingDiv.innerHTML = '<div class="chat-bubble">思考中...</div>';
      document.getElementById("panelBody").appendChild(loadingDiv);

      try {
        var availableFilesInfo = FILES.map(function(f) { return "- " + f.name + " (分类: " + f.category + ")"; }).join("\n");
        
        var systemPrompt = "你是公司内网的专业 IT 服务助手。你的任务是友善、准确地帮助员工解决电脑、网络、软件等 IT 问题。\n如果能够直接解答技术问题，请给出清晰的步骤。\n\n【当前可用文件】\n" + availableFilesInfo + "\n\n如果用户的请求可以通过上述文件解决，请解答问题，并且务必在回复中提到该文件的完整名称。回复要亲切、简洁、有帮助。";

        var messages = [
          { role: "system", content: systemPrompt }
        ].concat(chatHistory).concat([{ role: "user", content: text }]);

        var response = await fetch(LLM_CONFIG.baseURL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + LLM_CONFIG.apiKey
          },
          body: JSON.stringify({
            model: LLM_CONFIG.model,
            messages: messages,
            temperature: 0.3,
            thinking: { type: "disabled" }
          })
        });

        if (!response.ok) throw new Error("API请求失败");

        var data = await response.json();
        var replyText = data.choices[0].message.content;

        chatHistory.push({ role: "user", content: text });
        chatHistory.push({ role: "assistant", content: replyText });
        if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

        document.getElementById("loading-msg").remove();
        appendChatMessage(replyText, false);

        var mentionedFiles = FILES.filter(function(f) { return replyText.indexOf(f.name) !== -1 || replyText.indexOf(f.name.split('.')[0]) !== -1; });
        if (mentionedFiles.length > 0) {
           var uniqueFiles = [];
           var seen = {};
           mentionedFiles.forEach(function(file) {
             if (!seen[file.name]) { seen[file.name] = true; uniqueFiles.push(file); }
           });
           uniqueFiles.forEach(function(file) { appendChatFileCard(file); });
        }

      } catch (error) {
        var loadingMsg = document.getElementById("loading-msg");
        if (loadingMsg) loadingMsg.remove();
        appendChatMessage("抱歉，连接有点问题 \u{1F605} 请稍后再试，或者直接浏览文件列表！", false);
      } finally {
        panelSend.disabled = false;
      }
    }

    var searchTimer = null;
    searchInput.addEventListener("input", function(e) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function() { performSearch(e.target.value); }, 300);
    });
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        searchResults.classList.remove("show");
        searchInput.blur();
      }
    });

    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        searchInput.focus();
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-container")) {
        searchResults.classList.remove("show");
      }
    });

    document.querySelectorAll(".quick-card").forEach(card => {
      card.addEventListener("click", () => {
        if (card.id === "openAiBtn") {
          openFloatingPanel();
          return;
        }
        const category = card.dataset.category;
        if (category) {
          activeCategory = category;
          currentCategoryTitle.textContent = card.querySelector(".quick-card-title").textContent;
          renderFileCards();
          window.scrollTo({ top: document.querySelector(".files-section").offsetTop - 20, behavior: "smooth" });
        }
      });
    });

    document.getElementById("floatingBtn").addEventListener("click", () => {
      document.getElementById("floatingPanel").classList.toggle("open");
      if (document.getElementById("floatingPanel").classList.contains("open")) {
        document.getElementById("panelInput").focus();
      }
    });

    document.getElementById("panelSend").addEventListener("click", () => {
      sendMessage(document.getElementById("panelInput").value);
    });

    document.getElementById("panelInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage(document.getElementById("panelInput").value);
    });

    document.querySelectorAll(".quick-q-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        sendMessage(btn.dataset.question);
      });
    });

    function initApp() {
      var overlay = document.getElementById("loadingOverlay");
      if (overlay) overlay.classList.add("hidden");
      updateCounts();
      renderFileCards();
    }
  </script>
  <script>
    (function loadData() {
      var overlay = document.getElementById("loadingOverlay");
      var loadingText = document.getElementById("loadingText");
      var loadingError = document.getElementById("loadingError");
      var spinner = document.querySelector(".loading-spinner");

      var loadStartTime = Date.now();

      var dataScript = document.createElement('script');
      dataScript.src = 'data.js?t=' + loadStartTime;

      dataScript.onload = function() {
        overlay.classList.add('hidden');
        initApp();
      };

      dataScript.onerror = function() {
        if (loadingText) loadingText.style.display = 'none';
        if (spinner) spinner.style.display = 'none';
        if (loadingError) loadingError.classList.add('show');
      };

      document.body.appendChild(dataScript);

      setTimeout(function() {
        if (overlay && !overlay.classList.contains('hidden') && loadingError && !loadingError.classList.contains('show')) {
          if (loadingText) loadingText.textContent = '\u9996\u6b21\u52a0\u8f7d\u8f83\u6162\uff0c\u8bf7\u8010\u5fc3\u7b49\u5f85...';
        }
      }, 5000);
    })();
  </script>
</body>
</html>
